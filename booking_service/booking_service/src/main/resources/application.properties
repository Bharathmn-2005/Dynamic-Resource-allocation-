spring.application.name=booking_service
server.port=8082
spring.datasource.url=${BOOKING_DB_URL}
spring.datasource.password=${BOOKING_DB_PASSWORD}
spring.datasource.username=${BOOKING_DB_USERNAME}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
notification.service.url=${NOTIFICATION_SERVICE_URL}
app.dataset.path=${APP_DATASET_PATH}
app.dataset.import.enabled=true
app.dataset.import.clear-existing=false

# Redis is used for session storage/caching only. All application repositories are
# JPA repositories, so disable Spring Data Redis repository scanning to stop Spring
# from incorrectly trying to treat JPA repositories as Redis repositories.
spring.data.redis.repositories.enabled=false

ticket.reminder.enabled=${TICKET_REMINDER_ENABLED}
ticket.reminder.cron=0 0 * * * ?
ticket.reminder.days-before=${TICKET_REMINDER_DAYS_BEFORE}
app.timezone=${APP_TIMEZONE}
