spring.application.name=booking_service
server.port=8082

spring.datasource.url=${BOOKING_DB_URL}
spring.datasource.username=${BOOKING_DB_USERNAME}
spring.datasource.password=${BOOKING_DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

notification.service.url=${NOTIFICATION_SERVICE_URL}

# Redis
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}

# Dataset / Elasticsearch (driven by environment in docker-compose)
app.dataset.path=${APP_DATASET_PATH}
app.dataset.import.enabled=${APP_ELASTICSEARCH_IMPORT_ENABLED}
app.dataset.import.clear-existing=${APP_ELASTICSEARCH_IMPORT_FORCE}

spring.elasticsearch.uris=${ELASTICSEARCH_URL}
app.elasticsearch.import.enabled=${APP_ELASTICSEARCH_IMPORT_ENABLED}
app.elasticsearch.import.on-startup=${APP_ELASTICSEARCH_IMPORT_ON_STARTUP}
app.elasticsearch.import.force=${APP_ELASTICSEARCH_IMPORT_FORCE}
app.elasticsearch.import.csv-path=${APP_ELASTICSEARCH_IMPORT_CSV_PATH}

# Redis is used for session storage/caching only. All application repositories are
# JPA repositories, so disable Spring Data Redis repository scanning to stop Spring
# from incorrectly trying to treat JPA repositories as Redis repositories.
spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

ticket.reminder.enabled=true
ticket.reminder.cron=0 0 * * * ?
ticket.reminder.days-before=1
app.timezone=Asia/Kolkata