spring.application.name=booking_service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/booking_service
spring.datasource.username=postgres
spring.datasource.password=${BOOKING_DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

notification.service.url=http://localhost:8081

# Redis
spring.redis.host=localhost
spring.redis.port=6379

# Dataset / Elasticsearch
app.dataset.path=${APP_DATASET_PATH:classpath:railway-data.csv}
app.dataset.import.enabled=${APP_ELASTICSEARCH_IMPORT_ENABLED:true}
app.dataset.import.clear-existing=${APP_ELASTICSEARCH_IMPORT_FORCE:false}

spring.elasticsearch.uris=http://localhost:9200
app.elasticsearch.import.enabled=${APP_ELASTICSEARCH_IMPORT_ENABLED:true}
app.elasticsearch.import.on-startup=${APP_ELASTICSEARCH_IMPORT_ON_STARTUP:true}
app.elasticsearch.import.force=${APP_ELASTICSEARCH_IMPORT_FORCE:false}
app.elasticsearch.import.csv-path=${APP_ELASTICSEARCH_IMPORT_CSV_PATH:classpath:railway-data.csv}

# Redis is used for session storage/caching only. All application repositories are
# JPA repositories, so disable Spring Data Redis repository scanning to stop Spring
# from incorrectly trying to treat JPA repositories as Redis repositories.
spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

JWT_SECRET=${JWT_SECRET}

ticket.reminder.enabled=true
ticket.reminder.cron=0 0 * * * ?
ticket.reminder.days-before=1
app.timezone=Asia/Kolkata