spring.application.name=payment_service
server.port=8083

spring.datasource.url=${PAYMENT_DB_URL}
spring.datasource.username=${PAYMENT_DB_USERNAME}
spring.datasource.password=${PAYMENT_DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Booking Service connectivity (used to validate bookings / fetch fare)
booking.service.url=${BOOKING_SERVICE_URL}

# Payment gateway: SANDBOX (default, safe for local development) or RAZORPAY
payment.provider=${PAYMENT_PROVIDER}
payment.currency=${PAYMENT_CURRENCY}

# Credentials are supplied through environment variables; never hard-code secrets.
payment.provider.razorpay.key.id=${RAZORPAY_KEY_ID}
payment.provider.razorpay.key.secret=${RAZORPAY_KEY_SECRET}
payment.provider.razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

app.timezone=${APP_TIMEZONE}